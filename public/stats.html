<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BYUCKSAN 임원 AI 사용 현황 - 실시간 결과</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root{
            --navy:#1F3864; --navy-deep:#002060; --navy-light:#3b5b8c;
            --blue:#3b82f6; --indigo:#2563eb; --emerald:#10b981; --amber:#f59e0b;
            --line:#e2e8f0; --bg:#f1f5f9;
        }
        *{box-sizing:border-box}
        html,body{margin:0;padding:0}
        body{
            font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif;
            background-color:#f1f5f9;
            background-image:radial-gradient(at 0% 0%, hsla(217,100%,95%,1) 0, transparent 50%),
                             radial-gradient(at 100% 100%, hsla(210,100%,97%,1) 0, transparent 50%);
            background-attachment:fixed;
            color:#1e293b; -webkit-font-smoothing:antialiased;
            min-height:100vh; display:flex; flex-direction:column;
        }
        ::-webkit-scrollbar{width:6px;height:6px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}

        /* header */
        nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);
            backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
            border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.04)}
        .navin{max-width:1120px;margin:0 auto;padding:0 20px;height:64px;
               display:flex;justify-content:space-between;align-items:center}
        .brand{display:flex;align-items:center;gap:12px}
        .bslogo{width:36px;height:36px;border-radius:10px;background:var(--navy);color:#fff;
                display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;
                letter-spacing:-.05em;box-shadow:0 3px 8px rgba(31,56,100,.3)}
        .bs-t{margin:0;font-size:16.5px;font-weight:800;color:var(--navy-deep);letter-spacing:-.01em;line-height:1.2}
        .bs-s{margin:2px 0 0;font-size:11px;color:#64748b;font-weight:600;display:flex;align-items:center;gap:4px}
        .live{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;
              background:#fef2f2;color:#dc2626;font-size:12px;font-weight:800;border:1px solid #fecaca}
        .live .dot{width:8px;height:8px;border-radius:50%;background:#ef4444;animation:pulse 1.6s infinite}
        @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.85)}}
        .smh{display:inline}
        @media(max-width:500px){.smh{display:none}}

        main{flex:1;max-width:1120px;width:100%;margin:0 auto;padding:28px 20px 48px}
        .fadein{animation:fadeIn .6s cubic-bezier(.16,1,.3,1) forwards;opacity:0}
        @keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
        .d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}

        .sumrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;
                gap:16px;margin-bottom:24px}
        .sumrow h2{margin:0;font-size:25px;font-weight:800;color:#0f172a;letter-spacing:-.02em}
        .sumrow p{margin:6px 0 0;font-size:13.5px;color:#64748b;display:flex;align-items:center;gap:6px}
        .totbox{background:#fff;padding:14px 22px;border-radius:14px;border:1px solid var(--line);
                box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;align-items:center;gap:16px}
        .totbox .lab{font-size:13px;font-weight:700;color:#64748b}
        .totbox b{font-size:30px;font-weight:900;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums}
        .totbox .u{font-size:15px;color:#94a3b8;font-weight:600;margin-left:3px}

        .gcard{background:rgba(255,255,255,.96);border:1px solid rgba(226,232,240,.85);
               border-radius:20px;padding:24px;margin-bottom:24px;
               box-shadow:0 2px 4px rgba(0,0,0,.02),0 8px 16px rgba(0,0,0,.03);
               transition:transform .2s ease,box-shadow .2s ease}
        .gcard:hover{box-shadow:0 12px 28px rgba(0,0,0,.06);transform:translateY(-2px)}
        .gcard h3{margin:0 0 16px;font-size:17px;font-weight:800;color:#1e293b;display:flex;align-items:center;gap:8px}
        .gcard h3 .sub{font-size:11.5px;font-weight:500;color:#94a3b8;margin-left:auto}
        .gcard:empty{display:none}

        /* level ladder */
        .lvgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative}
        .lvgrid::before{content:"";position:absolute;top:26px;left:11%;width:78%;height:2px;
                        background:#e8edf4;border-radius:99px;z-index:0}
        .lv{display:flex;flex-direction:column;align-items:center;position:relative;z-index:1}
        .lv .cir{width:52px;height:52px;border-radius:99px;background:#fff;border:4px solid #e8edf4;
                 display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;
                 color:#94a3b8;margin-bottom:8px;transition:all .4s ease}
        .lv .nm{font-size:13.5px;font-weight:800;color:#475569}
        .lv .ct{font-size:12px;color:#94a3b8;margin-top:4px;font-variant-numeric:tabular-nums}
        .lv.on .cir{background:#fffbeb;border-color:#fbbf24;color:#b45309;transform:scale(1.18) translateY(-4px);
                    box-shadow:0 8px 20px rgba(245,158,11,.3)}
        .lv.on .nm{color:var(--navy);font-weight:900}
        .lv.on .ct{background:#fffbeb;color:#d97706;font-weight:800;padding:2px 8px;border-radius:7px}
        .lv.zero .cir{background:#f8fafc}
        .lv.zero .nm{color:#94a3b8}
        .lv .emoji{font-size:15px}
        @media(max-width:560px){.lv .cir{width:42px;height:42px;font-size:13px}
            .lv .nm{font-size:11.5px}.lv .ct{font-size:10px}.lv .emoji{font-size:12px}}

        /* chart rows */
        .chart-wrap{position:relative;width:100%}
        .h60{height:60px}.h120{height:120px}.h260{height:260px}

        /* progress rows (use etc) */
        .row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
        .row{margin:12px 0}
        .lab{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:5px;align-items:baseline}
        .lab .n{font-weight:800;color:var(--navy);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:13px}
        .track{height:10px;background:#f1f5f9;border-radius:99px;overflow:hidden}
        .fill{height:100%;background:var(--navy);border-radius:99px;transition:width .6s cubic-bezier(.16,1,.3,1)}
        .row.zero{opacity:.5}
        .row.zero .lab .n{color:#94a3b8;font-weight:600}
        .row.top .fill{background:linear-gradient(90deg,var(--navy),var(--blue))}

        /* chips */
        .chips{display:flex;flex-wrap:wrap;gap:8px}
        .chip{padding:6px 12px;border-radius:9px;font-size:12.5px;font-weight:700;
              background:#fff;border:1.5px solid var(--line);color:#94a3b8}
        .chip.on{background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe}
        .chip.zero{opacity:.55}
        .mini-q{margin-bottom:16px}
        .mini-q h4{margin:0 0 8px;font-size:13.5px;font-weight:800;color:#334155;line-height:1.35}

        .cm ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
        .cm li{background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy);
               border-radius:12px;padding:12px 16px;font-size:14px;line-height:1.6}
        .empty{text-align:center;padding:50px 20px;color:#94a3b8;background:rgba(255,255,255,.6);
               border-radius:18px;border:2px dashed #cbd5e1;margin-bottom:24px}
        .empty b{display:block;font-size:17px;color:#475569;margin-bottom:6px}
        .warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:12px 14px;
              border-radius:12px;font-size:13.5px;margin-bottom:20px}

        footer{text-align:center;font-size:12px;color:#94a3b8;padding:20px;
               border-top:1px solid var(--line);background:#fff}
        @media(prefers-color-scheme:dark){
            body{background-color:#14171c;color:#e8eaee;
                 background-image:radial-gradient(at 0% 0%, hsla(220,40%,12%,1) 0, transparent 50%),
                                  radial-gradient(at 100% 100%, hsla(220,35%,15%,1) 0, transparent 50%)}
            nav{background:rgba(20,23,28,.9);border-color:#2c323b}
            .bs-t{color:#9db8e8}.bs-s{color:#94a3b8}
            .gcard{background:rgba(28,32,39,.96);border-color:#2c323b}
            .gcard h3{color:#f1f5f9}.sumrow h2{color:#f1f5f9;color:#f1f5f9}
            .totbox{background:#1c2027;border-color:#2c323b}
            .lv .cir{background:#1c2027;border-color:#2c323b}
            .lv.on .cir{background:#292524;border-color:#fbbf24}
            .lv.zero .nm{color:#64748b}
            .track{background:#2c323b}.lab .n{color:#9db8e8}
            .fill{background:#4a6da8}
            .row.top .fill{background:linear-gradient(90deg,#4a6da8,#3b82f6)}
            .chip{background:#1c2027;border-color:#2c323b}
            .chip.on{background:#1e3a5f;color:#93c5fd;border-color:#2e4a75}
            .cm li{background:#1c2027;border-color:#2c323b}
            .mini-q h4{color:#cbd5e1}
            .empty{background:rgba(28,32,39,.6);border-color:#2c323b}
            .warn{background:#2c2410;border-color:#5c4a1a;color:#fcd34d}
            footer{background:#14171c}
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

<nav>
    <div class="navin">
        <div class="brand">
            <div class="bslogo">BS</div>
            <div>
                <h1 class="bs-t">임원 AI 사용 현황</h1>
                <p class="bs-s">📄 설문 결과 — 실시간 집계</p>
            </div>
        </div>
        <div class="live"><span class="dot"></span><span class="smh">LIVE 자동 갱신</span></div>
    </div>
</nav>

<main>
    <div class="sumrow fadein">
        <div>
            <h2>실시간 결과 대시보드</h2>
            <p>🔄 구글 시트 연동 · <span id="upd">연결 중…</span></p>
        </div>
        <div class="totbox">
            <span class="lab">총 응답자</span>
            <span><b id="tot">0</b><span class="u">명</span></span>
        </div>
    </div>

    <div id="warn"></div>
    <div id="levelBox"></div>

    <!-- Row 2: Service(bar) + freq/sub(doughnut) -->
    <div class="row2" id="row2"></div>

    <!-- Row 3: use(progress) + security(chips) -->
    <div class="row2" id="row3"></div>

    <div class="gcard cm" id="cmbox" style="display:none"></div>
</main>

<footer>© 2026 Byucksan Corp — 실시간 렌더링 (4초 간격)</footer>

<script>
const esc = s => String(s||'').replace(/[<>&]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]));
const pct = (n, b) => b > 0 ? Math.round(n / b * 100) : 0;
const NAVY='#1F3864', SL='#f1f5f9', BLUE='#3b82f6', EMERALD='#10b981', AMBER='#f59e0b';
let charts = {};

/* ── 레벨 사다리 ── */
function drawLevel(level){
    const box = document.getElementById('levelBox');
    if (!level || !level.counts || !(level.scored||0)){ box.innerHTML=''; return; }
    const scored = level.scored;
    const order = ['자연인','체험자','활용자','달인'];
    const meta = {'자연인':1,'체험자':2,'활용자':3,'달인':4};
    const emoji = k => (level.levels||[]).filter(x=>x.key===k)[0]?.emoji || '';
    const active = order.reduce((a,k)=> level.counts[k]>0 ? k : a, null);
    box.innerHTML = `<div class="gcard fadein d1">
        <h3>🏅 사용자 레벨 판정<span class="sub">자동 집계</span></h3>
        <div class="lvgrid">
          ${order.map(k=>{
            const c=level.counts[k]||0, p=Math.round(c/scored*100), isOn=active===k;
            return `<div class="lv ${isOn?'on':''} ${c===0?'zero':''}">
              <div class="cir" ${isOn?'style="font-size:19px;font-weight:900"':''}>${isOn?'4':meta[k]}</div>
              <span class="nm"><span class="emoji">${emoji[k]||''}</span> ${k}</span>
              <span class="ct">${c}명 (${p}%)</span>
            </div>`;
          }).join('')}
        </div>
      </div>`;
}

/* ── Chart 파괴·재생성 헬퍼 (중복 인스턴스 방지) ── */
function chart(id, cfg){
    if (charts[id]){ charts[id].destroy(); }
    const el = document.getElementById(id);
    if (!el) return;
    charts[id] = new Chart(el.getContext('2d'), cfg);
}

/* Row2: 서비스 가로 바 + freq/sub 도넛 */
function row2(stats){
    const box = document.getElementById('row2');
    const by = {}; stats.forEach(s=>by[s.id]=s);
    let html = '';

    if (by.tools){
        html += `<div class="gcard fadein d2" style="grid-column:auto"><h3>💻 현재 쓰고 계신 AI 서비스<span class="sub">복수 응답</span></h3>
          <div class="chart-wrap h260"><canvas id="serviceChart"></canvas></div></div>`;
    }

    const donutCols = [];
    if (by.freq) donutCols.push(`<div><h4 style="margin:0 0 8px;font-size:14px;font-weight:800;color:#1e293b">⏱️ 사용 빈도</h4>
        <div class="chart-wrap h120"><canvas id="freqChart"></canvas></div></div>`);
    if (by.paid) donutCols.push(`<div style="border-top:1px solid #f1f5f9;padding-top:14px"><h4 style="margin:0 0 8px;font-size:14px;font-weight:800;color:#1e293b">💳 유료 구독 여부</h4>
        <div class="chart-wrap h120"><canvas id="subChart"></canvas></div></div>`);
    if (donutCols.length){
        html += `<div class="gcard fadein d3" style="display:flex;flex-direction:column;justify-content:space-between;gap:14px">${donutCols.join('')}</div>`;
    }
    box.innerHTML = html;

    // 서비스 바 (첨부 스타일: 최다 항목 강조)
    if (by.tools){
        const max = Math.max(...by.tools.options.map(o=>o.count),0);
        chart('serviceChart', {
            type:'bar',
            data:{ labels: by.tools.options.map(o=>o.label),
                datasets:[{ label:'응답자', data: by.tools.options.map(o=>o.count),
                    backgroundColor: by.tools.options.map(o=> o.count===max && max>0 ? NAVY : SL),
                    borderRadius:6, barThickness:22 }]},
            options:{ indexAxis:'y', plugins:{legend:{display:false}},
                scales:{ x:{beginAtZero:true, ticks:{precision:0}, grid:{color:SL}, border:{display:false}},
                         y:{grid:{display:false}, border:{display:false}, ticks:{color:'#475569',font:{weight:'600'}}} },
                animation:{duration:800, easing:'easeOutQuart'} }
        });
    }
    // freq 도넛
    if (by.freq){
        const arr = by.freq.options;
        const max = Math.max(...arr.map(o=>o.count),0);
        const selIdx = arr.findIndex(o=>o.count===max && max>0);
        chart('freqChart', {
            type:'doughnut',
            data:{ labels: arr.map(o=>o.label), datasets:[{ data: arr.map(o=>o.count),
                backgroundColor: arr.map((_,i)=> i===selIdx ? EMERALD : SL), borderWidth:0, hoverOffset:4 }]},
            options:{ cutout:'70%', plugins:{ legend:{display:false} } },
            plugins:[{ id:'cFreq', beforeDraw(c){ if(selIdx<0)return; const ctx=c.ctx,W=c.width/2,H=c.height/2;
                ctx.restore(); ctx.font='700 12px Pretendard'; ctx.fillStyle='#1e293b'; ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText(arr[selIdx].label + ' ' + arr[selIdx].count+"명", W, H); ctx.save(); }}]
        });
    }
    // paid 도넛
    if (by.paid){
        const arr = by.paid.options;
        const max = Math.max(...arr.map(o=>o.count),0);
        const selIdx = arr.findIndex(o=>o.count===max && max>0);
        chart('subChart', {
            type:'doughnut',
            data:{ labels: arr.map(o=>o.label), datasets:[{ data: arr.map(o=>o.count),
                backgroundColor: arr.map((_,i)=> i===selIdx ? BLUE : SL), borderWidth:0, hoverOffset:4 }]},
            options:{ cutout:'70%', plugins:{ legend:{display:false} } },
            plugins:[{ id:'cSub', beforeDraw(c){ if(selIdx<0)return; const ctx=c.ctx,W=c.width/2,H=c.height/2;
                ctx.restore(); ctx.font='700 11px Pretendard'; ctx.fillStyle='#1e293b'; ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText(arr[selIdx].count+"명", W, H); ctx.save(); }}]
        });
    }
}

/* Row3: use progress + agent/trust/data/support chips */
function row3(stats){
    const box = document.getElementById('row3');
    const by = {}; stats.forEach(s=>by[s.id]=s);
    let html='';

    if (by.use){
        const max = Math.max(...by.use.options.map(o=>o.count),0);
        html += `<div class="gcard fadein d2"><h3>🎯 주로 쓰는 용도<span class="sub">복수 응답</span></h3>
          ${by.use.options.map(o=>{
            const p=pct(o.count, by.use.answered), top=max>0&&o.count===max;
            return `<div class="row ${top?'top':''} ${o.count===0?'zero':''}">
              <div class="lab"><span>${o.label}</span><span class="n">${o.count}명 (${p}%)</span></div>
              <div class="track"><div class="fill" style="width:${p}%"></div></div></div>`;
          }).join('')}
        </div>`;
    }

    const secStats = stats.filter(s=>['agent','trust','data','support'].includes(s.id));
    if (secStats.length){
        html += `<div class="gcard fadein d3"><h3>🧠 AI 활용 인식·태도</h3>
          ${secStats.map(s=>{
            const max=Math.max(...s.options.map(o=>o.count),0);
            return `<div class="mini-q"><h4>${esc(s.title)}</h4><div class="chips">
              ${s.options.map(o=>{
                const on=max>0&&o.count===max;
                return `<span class="chip ${on?'on':''} ${o.count===0?'zero':''}">${esc(o.label)} (${o.count}명)</span>`;
              }).join('')}</div></div>`;
          }).join('')}
        </div>`;
    }
    box.innerHTML = html;
}

function draw(d){
    document.getElementById('tot').textContent = d.total;
    document.getElementById('upd').innerHTML =
        '🔄 구글 시트 연동 · ' + new Date().toLocaleTimeString('ko-KR') +
        (d.stale ? ' · <b style="color:#d97706">갱신 지연</b>' : '');
    document.getElementById('warn').innerHTML = d.persisted ? '' :
        '<div class="warn">⚠️ 저장소가 연결되지 않아 응답이 유지되지 않습니다.</div>';

    const row2el=document.getElementById('row2'), row3el=document.getElementById('row3'),
          cm=document.getElementById('cmbox');
    const stats = d.stats || [];

    if (!d.total){
        row2el.innerHTML=''; row3el.innerHTML='';
        Object.keys(charts).forEach(k=>{ charts[k].destroy(); });
        charts={};
        cm.style.display='none';
        drawLevel(d.level);
        return;
    }
    row2(stats); row3(stats);

    if (d.comments && d.comments.length){
        cm.style.display='';
        cm.innerHTML=`<h3>💬 한마디<span class="sub">${d.comments.length}건</span></h3>
          <ul>${d.comments.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`;
    } else cm.style.display='none';
    drawLevel(d.level);
}

let lastGood=null;
async function tick(){
    try{
        const r = await fetch('/api/stats', { cache:'no-store' });
        if (!r.ok) throw new Error('HTTP '+r.status);
        const j = await r.json();
        if (j && j.total!==undefined){ draw(j); lastGood=j; }
        else if (lastGood) draw({...lastGood, stale:true});
    }catch(e){
        if (lastGood) draw({...lastGood, stale:true});
        else document.getElementById('upd').textContent='연결 오류 — 재시도 중';
    }
}
tick();
setInterval(tick, 4000);
</script>
</body>
</html>
