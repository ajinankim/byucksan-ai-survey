<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 활용 교육 사전 설문 — 실시간</title>
<style>
  :root{
    --navy:#1F3864; --navy2:#002060; --grey:#6B7280; --accent:#C00000;
    --line:#E3E6EC; --bg:#F5F6F8; --card:#FFFFFF; --text:#1B1F27; --track:#E8EBF0;
    --l1:#9DB8E8; --l2:#5B84CC; --l3:#2F5AA8; --l4:#14306B;
    --s1:#2F5AA8; --s2:#2A9D8F; --s3:#E9A23B; --s4:#C0504D; --s5:#8A93A3;
    color-scheme: light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Malgun Gothic","맑은 고딕",-apple-system,BlinkMacSystemFont,sans-serif;
       background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;
       padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
  .wrap{max-width:1200px;margin:0 auto;padding:0 16px 48px}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;
         padding:22px 0 14px;border-bottom:2px solid var(--navy)}
  .kicker{font-size:11px;letter-spacing:.14em;color:var(--grey);font-weight:700}
  h1{margin:6px 0 0;font-size:22px;font-weight:800;color:var(--navy2)}
  .total{text-align:right}
  .total b{display:block;font-size:40px;font-weight:800;color:var(--navy);line-height:1}
  .total span{font-size:11.5px;color:var(--grey);font-weight:700;letter-spacing:.06em}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--grey);margin-top:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:#2FB344;animation:b 1.6s infinite}
  @keyframes b{0%,100%{opacity:1}50%{opacity:.25}}
  .sess{margin-top:8px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sess select{font:inherit;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:inherit}
  #st{font-weight:700}
  h2.sec{font-size:13px;letter-spacing:.08em;color:var(--grey);margin:26px 0 10px;font-weight:800}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h3{margin:0 0 2px;font-size:15px;font-weight:700;line-height:1.35}
  .card .meta{font-size:11.5px;color:var(--grey);margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
  .wide{grid-column:1/-1}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .tile b{display:block;font-size:30px;font-weight:800;color:var(--navy);line-height:1.1}
  .tile span{font-size:12px;color:var(--grey)}
  .tile i{display:block;margin-top:8px;height:5px;border-radius:9px;background:var(--track);overflow:hidden}
  .tile u{display:block;height:100%;background:var(--navy);border-radius:9px;transition:width .5s}
  /* Level 분포 */
  .levels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:700px){.levels{grid-template-columns:repeat(2,1fr)}}
  .lv{border-radius:14px;padding:14px;color:#fff;min-height:190px;
      display:flex;flex-direction:column;justify-content:space-between}
  .lv .nm{font-size:12px;font-weight:800;letter-spacing:.08em;opacity:.92}
  .lv .tt{font-size:15px;font-weight:800;line-height:1.3;margin-top:2px}
  .lv .ds{font-size:11.5px;opacity:.9;margin-top:2px}
  .lv .pc{font-size:44px;font-weight:800;line-height:1;margin-top:10px}
  .lv .pc small{font-size:18px;font-weight:700}
  .lv .nn{font-size:12.5px;opacity:.95}
  .lv.l1{background:var(--l1);color:#14306B}
  .lv.l2{background:var(--l2)}.lv.l3{background:var(--l3)}.lv.l4{background:var(--l4)}
  .lv{position:relative;cursor:help;outline:none}
  .lv .i{position:absolute;top:10px;right:12px;width:20px;height:20px;border-radius:50%;
         border:1.5px solid currentColor;font-size:12px;font-weight:800;line-height:17px;text-align:center;opacity:.8}
  .lv .tip{position:absolute;inset:0;border-radius:14px;padding:12px 13px;background:#0F1628;color:#F1F4FA;
           font-size:12px;line-height:1.5;opacity:0;visibility:hidden;transition:opacity .15s;overflow:auto;z-index:2}
  .lv:hover .tip,.lv:focus .tip{opacity:1;visibility:visible}
  .tip b{display:block;font-size:12.5px;margin-bottom:4px;color:#fff}
  .tip dt{color:#9DB8E8;font-weight:700;margin-top:6px}
  .tip dd{margin:0}
  .stack{display:flex;height:16px;border-radius:99px;overflow:hidden;margin:14px 0 6px;background:var(--track)}
  .stack i{display:block;height:100%;transition:width .5s}
  .note{font-size:11.5px;color:var(--grey)}
  .alloc{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .alloc div{flex:1 1 90px;background:var(--bg);border-radius:10px;padding:8px 10px;font-size:12px}
  .alloc b{display:block;font-size:20px;color:var(--navy)}
  /* 막대 */
  .row{margin:9px 0}
  .lab{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:4px}
  .lab .n{font-weight:700;color:var(--navy);white-space:nowrap;font-variant-numeric:tabular-nums}
  .track{height:11px;background:var(--track);border-radius:99px;overflow:hidden}
  .fill{height:100%;background:var(--navy);border-radius:99px;transition:width .5s ease}
  .row.top .fill{background:var(--accent)}.row.top .lab .n{color:var(--accent)}
  /* 도넛 */
  .donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .donut svg{width:132px;height:132px;flex:none}
  .donut text{fill:var(--text);font-weight:800}
  .leg{flex:1 1 150px;font-size:12.5px}
  .leg div{display:flex;align-items:center;gap:7px;margin:4px 0}
  .leg i{width:10px;height:10px;border-radius:3px;flex:none}
  .leg b{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
  /* 세로 막대 */
  .cols{display:flex;gap:8px;align-items:flex-end;height:150px;margin-top:6px}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
  .col u{display:block;width:100%;border-radius:6px 6px 0 0;background:var(--s1);transition:height .5s;min-height:2px}
  .col em{font-style:normal;font-size:12px;font-weight:800;margin-bottom:3px}
  .collab{display:flex;gap:8px;margin-top:6px}
  .collab span{flex:1;text-align:center;font-size:11px;color:var(--grey);line-height:1.25;min-width:0}
  /* 수요 갭 */
  .gap{display:grid;grid-template-columns:minmax(110px,1.1fr) 3fr auto;gap:6px 10px;align-items:center;margin:8px 0;font-size:13px}
  .gap .bars{display:flex;flex-direction:column;gap:3px}
  .gap u{display:block;height:8px;border-radius:99px;transition:width .5s}
  .gap .now{background:var(--s5)}.gap .wantb{background:var(--s1)}
  .gap .d{font-weight:800;font-size:12px;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
  .d.up{color:#1B8A5A}.d.dn{color:var(--accent)}.d.eq{color:var(--grey)}
  .key{display:flex;gap:14px;font-size:11.5px;color:var(--grey);margin-bottom:6px}
  .key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  /* 한마디 */
  .cm h2{font-size:13px;letter-spacing:.08em;color:var(--grey);margin:26px 0 10px;font-weight:800}
  .cm ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .cm li{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--navy);
         border-radius:8px;padding:10px 12px;font-size:13.5px}
  .empty{text-align:center;padding:60px 20px;color:var(--grey)}
  .warn{background:#FFF7E6;border:1px solid #F0D9A8;color:#7A5A12;padding:11px;border-radius:8px;font-size:13px;margin:14px 0}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14171C;--card:#1C2027;--line:#2C323B;--text:#E8EAEE;--grey:#9AA2AF;--track:#2C323B;
      --navy:#9DB8E8;--navy2:#9DB8E8;--accent:#FF7B72;
      --l1:#2A3B5E;--l2:#3D5F9E;--l3:#5B84CC;--l4:#8FB0EE;
      --s1:#6C9AE8;--s2:#4DBBAE;--s3:#F0B35A;--s4:#E27C78;--s5:#7A8394;
      color-scheme:dark;
    }
    :root:not([data-theme="light"]) .lv.l1{color:#E8EAEE}
    :root:not([data-theme="light"]) .lv.l4{color:#0F1A33}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="kicker">BYUCKSAN</div>
      <h1>AI 활용 교육 사전 설문 — 실시간 결과</h1>
      <div class="live"><span class="dot"></span><span id="upd">연결 중…</span></div>
      <div class="sess"><label for="sel">설문 회차</label>
        <select id="sel"></select><span id="st"></span></div>
    </div>
    <div class="total"><b id="tot">0</b><span>응답</span></div>
  </header>
  <div id="warn"></div>
  <div id="board"></div>
  <div class="cm" id="cmbox"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[<>&"]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m]));
const pct = (n, base) => base > 0 ? Math.round(n / base * 100) : 0;
const SER = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)'];

// ── 교육과정 Level (교육계획서 3.1) ─────────────────────────────
// 설문 6번 「내 AI 활용 수준」 선택지(0~4)를 교육 Level 1~4로 옮긴다.
//   거의 안 써 봤다·질문하고 답을 받는 정도 → L1, 파일 요약·정리 → L2,
//   여러 단계 작업을 연결 → L3, 업무 흐름을 맡겨 둔다 → L4
const LEVELS = [
  { cls:'l1', nm:'LEVEL 1', tt:'자료 검색·정리·리뷰', ds:'묻고 요약하고 검토한다', from:[0,1],
    crit:'「거의 안 써 봤다」 또는 「질문하고 답을 받는 정도」', edu:'긴 자료 요약 · 시장·기업 조사 · 회의록 정리' },
  { cls:'l2', nm:'LEVEL 2', tt:'자료 생성·바이브코딩', ds:'문서·표·간단한 도구를 만든다', from:[2],
    crit:'「파일을 올려 요약·정리를 시킨다」', edu:'문서 초안 작성 · 보고서·슬라이드 · 바이브코딩 체험' },
  { cls:'l3', nm:'LEVEL 3', tt:'에이전트 업무 활용', ds:'여러 단계 업무를 위임한다', from:[3],
    crit:'「여러 단계 작업을 연결해서 시킨다」', edu:'파일 읽기·정리 · 문서 작성·저장 · 사람이 최종 확인' },
  { cls:'l4', nm:'LEVEL 4', tt:'전문가', ds:'AI를 설계·개선하고 전파한다', from:[4],
    crit:'「AI에게 업무 흐름을 맡겨 둔다」', edu:'업무별 전문 활용 · 직접 설계·개선 · 동료 코칭' },
];
// 교육계획서 2.2 시나리오별 Level 교육 비중(가안): 입문형=L1 응답자, 확산형=L2, 고도화형=L3·L4
const WEIGHTS = { A:[50,30,15,5], B:[30,35,25,10], C:[10,30,40,20] };

function levelSection(S){
  const lv = S.level;
  if (!lv || !lv.answered) return '';
  const cnt = LEVELS.map(L => L.from.reduce((a, i) => a + (lv.options[i] ? lv.options[i].count : 0), 0));
  const n = lv.answered;
  const p = cnt.map(c => pct(c, n));
  const never = lv.options[0] ? lv.options[0].count : 0;
  const share = { A: cnt[0]/n, B: cnt[1]/n, C: (cnt[2]+cnt[3])/n };
  const alloc = [0,1,2,3].map(i => Math.round(share.A*WEIGHTS.A[i] + share.B*WEIGHTS.B[i] + share.C*WEIGHTS.C[i]));
  return `<h2 class="sec">AI 활용 Level 분포 (교육과정 기준)</h2>
  <div class="card">
    <div class="levels">${LEVELS.map((L,i) => `<div class="lv ${L.cls}" tabindex="0" aria-label="${L.nm} 기준: ${L.crit}">
        <span class="i" aria-hidden="true">i</span>
        <div class="tip"><b>${L.nm} 판정 기준</b>
          <dl style="margin:0"><dt>설문 6번 응답</dt><dd>${L.crit}</dd>
          <dt>교육 내용</dt><dd>${L.edu}</dd></dl></div>
        <div><div class="nm">${L.nm}</div><div class="tt">${L.tt}</div><div class="ds">${L.ds}</div></div>
        <div><div class="pc">${p[i]}<small>%</small></div><div class="nn">${cnt[i]}명${i===0 && never ? ` (거의 안 써 봄 ${never}명 포함)` : ''}</div></div>
      </div>`).join('')}</div>
    <div class="stack">${LEVELS.map((L,i) => `<i style="width:${p[i]}%;background:var(--${L.cls})"></i>`).join('')}</div>
    <div class="note">응답 ${n}명 · 6번 「내 AI 활용 수준」 기준 · 카드에 마우스를 올리거나 누르면 Level별 기준이 보입니다</div>
    <div class="note" style="margin-top:10px">예상 교육 시간 배분 (교육계획서 가안 비중을 응답 분포로 가중)</div>
    <div class="alloc">${alloc.map((a,i) => `<div>Level ${i+1}<b>${a}%</b></div>`).join('')}</div>
  </div>`;
}

// ── 요약 지표 ────────────────────────────────────────────────
function opt(S, id, labels){
  const s = S[id]; if (!s) return [0, 0];
  const c = s.options.filter(o => labels.includes(o.label)).reduce((a, o) => a + o.count, 0);
  return [c, s.answered];
}
function tiles(S){
  const defs = [
    ['주 2회 이상 사용', opt(S,'freq',['하루에 여러 번','하루 1회 정도','주 2~3회'])],
    ['유료 구독 중', S.paid ? [S.paid.anyPaid || 0, S.paid.answered] : [0, 0]],
    ['에이전트 직접 사용', opt(S,'agent',['잘 알고 직접 쓴다'])],
    ['업무 자료 외부 입력 경험', opt(S,'data',['있다','민감하지 않은 자료만'])],
    ['교육 후 활용 의향', opt(S,'intent',['적극 쓰겠다','써 볼 것 같다'])],
  ];
  return `<h2 class="sec">한눈에 보기</h2><div class="tiles">${defs.map(([t,[c,n]]) => {
    const p = pct(c, n);
    return `<div class="tile"><b>${p}%</b><span>${t} · ${c}/${n}명</span><i><u style="width:${p}%"></u></i></div>`;
  }).join('')}</div>`;
}

// ── 차트 조각 ────────────────────────────────────────────────
function head(s, kind){
  return `<h3>${esc(s.title)}</h3><div class="meta">${kind} · 응답 ${s.answered}명</div>`;
}
function donut(s){
  const n = s.answered, R = 52, C = 2*Math.PI*R;
  let off = 0, arcs = '';
  s.options.forEach((o, i) => {
    const len = n ? o.count / n * C : 0;
    arcs += `<circle r="${R}" cx="66" cy="66" fill="none" stroke="${SER[i % SER.length]}" stroke-width="18"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 66 66)"/>`;
    off += len;
  });
  const top = s.options.reduce((a, o) => o.count > a.count ? o : a, s.options[0]);
  return `<div class="card">${head(s,'단일 응답')}<div class="donut">
    <svg viewBox="0 0 132 132" role="img" aria-label="${esc(s.title)}">
      <circle r="${R}" cx="66" cy="66" fill="none" stroke="var(--track)" stroke-width="18"/>${arcs}
      <text x="66" y="71" text-anchor="middle" font-size="22">${n ? pct(top.count, n) : 0}%</text></svg>
    <div class="leg">${s.options.map((o,i) => `<div><i style="background:${SER[i % SER.length]}"></i>${esc(o.label)}<b>${o.count}명 · ${pct(o.count,n)}%</b></div>`).join('')}</div>
  </div></div>`;
}
function columns(s){
  const max = Math.max(...s.options.map(o => o.count), 1), n = s.answered;
  return `<div class="card">${head(s,'단일 응답')}
    <div class="cols">${s.options.map(o => `<div class="col"><em>${pct(o.count,n)}%</em>
      <u style="height:${Math.max(o.count/max*100,1.5)}%"></u></div>`).join('')}</div>
    <div class="collab">${s.options.map(o => `<span>${esc(o.label)}<br>${o.count}명</span>`).join('')}</div></div>`;
}
function bars(s, wide){
  const max = Math.max(...s.options.map(o => o.count), 0);
  const kind = s.type === 'multi' ? '복수 응답' : '단일 응답';
  return `<div class="card${wide ? ' wide' : ''}">${head(s, kind)}` + s.options.map(o => {
    const p = pct(o.count, s.answered), top = max > 0 && o.count === max ? ' top' : '';
    return `<div class="row${top}"><div class="lab"><span>${esc(o.label)}</span>
      <span class="n">${o.count}명 · ${p}%</span></div>
      <div class="track"><div class="fill" style="width:${p}%"></div></div></div>`;
  }).join('') + '</div>';
}
// 4번(지금 쓰는 용도)과 5번(앞으로 해결하고 싶은 업무)은 같은 목록 — 수요 갭을 한 화면에
function gapChart(use, want){
  const rows = use.options.map((o, i) => {
    const a = pct(o.count, use.answered), b = pct(want.options[i].count, want.answered);
    return { label:o.label, a, b, d:b - a };
  }).sort((x, y) => y.b - x.b);
  const mx = Math.max(...rows.flatMap(r => [r.a, r.b]), 1);
  return `<div class="card wide"><h3>쓰는 용도 vs 앞으로 원하는 업무 — 교육 데모 주제 후보</h3>
    <div class="meta">희망 비율이 높은 순 · 차이 = 희망 − 현재 (+가 클수록 교육 수요 큼)</div>
    <div class="key"><span><i style="background:var(--s5)"></i>지금 쓴다 (${use.answered}명)</span><span><i style="background:var(--s1)"></i>앞으로 원한다 (${want.answered}명)</span></div>
    ${rows.map(r => `<div class="gap"><span>${esc(r.label)}</span>
      <div class="bars"><u class="now" style="width:${r.a/mx*100}%"></u><u class="wantb" style="width:${r.b/mx*100}%"></u></div>
      <span class="d ${r.d>0?'up':r.d<0?'dn':'eq'}">${r.d>0?'+':''}${r.d}p<br><small style="font-weight:400;color:var(--grey)">${r.a}→${r.b}%</small></span></div>`).join('')}</div>`;
}

function draw(d){
  drawSessions(d);
  $('tot').textContent = d.total;
  const bk = {redis:'Redis', memory:'메모리'}[d.backend] || '';
  $('upd').textContent = '자동 갱신 · ' + new Date().toLocaleTimeString('ko-KR') + (bk ? ' · ' + bk : '');
  $('warn').innerHTML = d.persisted ? '' :
    '<div class="warn">저장소가 연결되지 않아 응답이 유지되지 않습니다. ' +
    'Vercel Storage에서 Upstash Redis를 연결한 뒤 재배포해 주세요.</div>';

  if (!d.total){
    lastBoard = '';
    $('board').innerHTML = !d.session
      ? '<div class="empty">진행 중인 설문이 없습니다.<br>/admin.html 에서 설문을 시작해 주세요.</div>'
      : '<div class="empty">아직 응답이 없습니다.<br>QR을 스캔해 참여해 주세요.</div>';
    $('cmbox').innerHTML = '';
    return;
  }

  const S = Object.fromEntries(d.stats.map(s => [s.id, s]));
  let h = levelSection(S) + tiles(S);

  h += '<h2 class="sec">AI 이용 현황</h2><div class="grid">';
  if (S.tools) h += bars(S.tools);
  if (S.paid) h += bars(S.paid);
  if (S.freq) h += columns(S.freq);
  h += '</div>';

  h += '<h2 class="sec">활용 용도와 교육 수요</h2><div class="grid">';
  if (S.use && S.want) h += gapChart(S.use, S.want);
  h += '</div>';

  h += '<h2 class="sec">에이전트 · 보안 · 교육 의향</h2><div class="grid">';
  if (S.agent) h += donut(S.agent);
  if (S.trust) h += bars(S.trust);
  if (S.data) h += donut(S.data);
  if (S.intent) h += donut(S.intent);
  h += '</div>';

  if (h !== lastBoard){ $('board').innerHTML = h; lastBoard = h; }   // 같으면 다시 그리지 않아 툴팁이 깜빡이지 않는다

  $('cmbox').innerHTML = d.comments && d.comments.length
    ? `<h2>한마디 (${d.comments.length})</h2><ul>` + d.comments.map(c => `<li>${esc(c)}</li>`).join('') + '</ul>'
    : '';
}

let lastBoard = '';
let chosen = '';   // 사용자가 고른 회차 (비어 있으면 서버가 진행 중/최근 회차를 고른다)
$('sel').addEventListener('change', e => { chosen = e.target.value; tick(); });

function drawSessions(d){
  const cur = d.session ? d.session.id : '';
  $('sel').innerHTML = (d.sessions || []).map(x =>
    `<option value="${esc(x.id)}"${x.id === cur ? ' selected' : ''}>${esc(x.label)}${x.id === d.active ? ' (진행 중)' : ''}</option>`
  ).join('') || '<option>회차 없음</option>';
  $('st').textContent = !d.session ? '설문을 시작하지 않았습니다'
    : d.session.id === d.active ? '● 접수 중' : '■ 종료됨 — 더 이상 변하지 않습니다';
}

async function tick(){
  try{
    const r = await fetch('/api/stats?t=' + Date.now() + (chosen ? '&session=' + encodeURIComponent(chosen) : ''), { cache:'no-store' });
    draw(await r.json());
  }catch(e){
    $('upd').textContent = '연결 오류 — 재시도 중';
  }
}
tick();
setInterval(tick, 4000);
// 뒤로가기(bfcache)·탭 복귀 시 이전 화면이 보이지 않도록 즉시 다시 불러온다
window.addEventListener('pageshow', e => { if (e.persisted) tick(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
</script>
</body>
</html>
