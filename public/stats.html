<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BYUCKSAN AI 사용 현황 - 실시간 결과</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root{
            --navy:#1F3864; --navy-deep:#002060; --navy-light:#3b5b8c;
            --blue:#3b82f6; --indigo:#2563eb; --emerald:#10b981; --amber:#f59e0b;
            --line:#e2e8f0; --bg:#f1f5f9;
            /* 레벨 분포 순서형(ordinal) 램프 — 자연인(밝음) → 달인(진함), 단일 색조 */
            --lv1:#93AEDA; --lv2:#6389C4; --lv3:#3E619B; --lv4:#1F3864;
        }
        *{box-sizing:border-box}
        html,body{margin:0;padding:0}
        body{
            font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif;
            background-color:#f1f5f9;
            background-image:radial-gradient(at 0% 0%, hsla(217,100%,95%,1) 0, transparent 50%),
                             radial-gradient(at 100% 100%, hsla(210,100%,97%,1) 0, transparent 50%);
            background-attachment:fixed;
            color:#1e293b; -webkit-font-smoothing:antialiased;
            min-height:100vh; display:flex; flex-direction:column;
        }
        ::-webkit-scrollbar{width:6px;height:6px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}

        /* header */
        nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);
            backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
            border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.04)}
        .navin{max-width:1120px;margin:0 auto;padding:0 20px;height:64px;
               display:flex;justify-content:space-between;align-items:center}
        .brand{display:flex;align-items:center;gap:12px}
        .bslogo{width:36px;height:36px;border-radius:10px;background:var(--navy);color:#fff;
                display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;
                letter-spacing:-.05em;box-shadow:0 3px 8px rgba(31,56,100,.3)}
        .bs-t{margin:0;font-size:16.5px;font-weight:800;color:var(--navy-deep);letter-spacing:-.01em;line-height:1.2}
        .bs-s{margin:2px 0 0;font-size:11px;color:#64748b;font-weight:600;display:flex;align-items:center;gap:4px}
        .live{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;
                      background:#fff;color:#1f3864;font-size:13px;font-weight:800;border:1.5px solid #cbd5e1;text-decoration:none}
                .live:hover{background:#eef2f7}
                .tip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;
                     background:#1f3864;color:#fff;font-size:13px;font-weight:800;border:1.5px solid #1f3864;text-decoration:none}
                .tip:hover{background:#002060}
                .navbtns{display:flex;align-items:center;gap:8px}
                .smh{display:inline}
                @media(max-width:500px){.smh{display:none}}

        main{flex:1;max-width:1120px;width:100%;margin:0 auto;padding:28px 20px 48px}
        .fadein{animation:fadeIn .6s cubic-bezier(.16,1,.3,1) forwards;opacity:0}
        @keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
        .d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}

        .sumrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;
                gap:16px;margin-bottom:24px}
        .sumrow h2{margin:0;font-size:25px;font-weight:800;color:#0f172a;letter-spacing:-.02em}
        .sumrow p{margin:6px 0 0;font-size:13.5px;color:#64748b;display:flex;align-items:center;gap:6px}
        .totbox{background:#fff;padding:14px 22px;border-radius:14px;border:1px solid var(--line);
                box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;align-items:center;gap:16px}
        .totbox .lab{font-size:13px;font-weight:700;color:#64748b}
        .totbox b{font-size:30px;font-weight:900;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums}
        .totbox .u{font-size:15px;color:#94a3b8;font-weight:600;margin-left:3px}

        .gcard{background:rgba(255,255,255,.96);border:1px solid rgba(226,232,240,.85);
               border-radius:20px;padding:24px;margin-bottom:24px;
               box-shadow:0 2px 4px rgba(0,0,0,.02),0 8px 16px rgba(0,0,0,.03);
               transition:transform .2s ease,box-shadow .2s ease}
        .gcard:hover{box-shadow:0 12px 28px rgba(0,0,0,.06);transform:translateY(-2px)}
        .gcard h3{margin:0 0 16px;font-size:17px;font-weight:800;color:#1e293b;display:flex;align-items:center;gap:8px}
        .gcard h3 .sub{font-size:11.5px;font-weight:500;color:#94a3b8;margin-left:auto}
        .gcard:empty{display:none}

        /* level distribution — treemap, ordinal 1-hue ramp
           (light=자연인→dark=달인), tile area ∝ count (squarified layout) */
        .lvtreemap{position:relative;width:100%;height:220px;border-radius:12px;overflow:hidden}
        .lvtile{position:absolute;box-sizing:border-box;border:2px solid #fff;border-radius:8px;
                display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;
                gap:2px;padding:10px 12px;overflow:hidden;
                transition:left .5s cubic-bezier(.16,1,.3,1),top .5s cubic-bezier(.16,1,.3,1),
                           width .5s cubic-bezier(.16,1,.3,1),height .5s cubic-bezier(.16,1,.3,1)}
        .lvtile.mid,.lvtile.tiny{align-items:center;justify-content:center}
        .lvtile .nm{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:5px;white-space:nowrap}
        .lvtile .nm .emoji{font-size:15px}
        .lvtile .val{font-size:12.5px;font-weight:700;opacity:.85;font-variant-numeric:tabular-nums}
        .lvtile .val .p{font-weight:600;opacity:.85;margin-left:2px}
        .lvtile .badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;
                       font-size:9.5px;font-weight:800;background:#fffbeb;color:#b45309;
                       border:1px solid #fde68a;vertical-align:middle}
        .lvtile[data-lv="1"]{color:#0b0b0b}
        .lvtile[data-lv="2"]{color:#0b0b0b}
        .lvtile[data-lv="3"]{color:#fff}
        .lvtile[data-lv="4"]{color:#fff}
        .lvzero{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
        .lvzchip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;
                 font-size:12px;font-weight:700;color:#94a3b8;background:#f8fafc;border:1.5px dashed #cbd5e1}
        @media(max-width:560px){.lvtreemap{height:190px}.lvtile .nm{font-size:12px}.lvtile .val{font-size:11px}}

        /* chart rows */
        .chart-wrap{position:relative;width:100%}
        .h60{height:60px}.h120{height:120px}.h260{height:260px}

        /* progress rows (use etc) */
        /* Row2: 서비스(2fr) + 빈도/구독(1fr) — 첨부 lg:grid-cols-3 대응 */
        .row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:24px}
        @media(min-width:1024px){.row2{grid-template-columns:2fr 1fr}}
        .row{margin:12px 0}
        .lab{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:5px;align-items:baseline}
        .lab .n{font-weight:800;color:var(--navy);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:13px}
        .track{height:10px;background:#f1f5f9;border-radius:99px;overflow:hidden}
        .fill{height:100%;background:var(--navy);border-radius:99px;transition:width .6s cubic-bezier(.16,1,.3,1)}
        .row.zero{opacity:.5}
        .row.zero .lab .n{color:#94a3b8;font-weight:600}
        .row.top .fill{background:linear-gradient(90deg,var(--navy),var(--blue))}

        /* chips */
        .chips{display:flex;flex-wrap:wrap;gap:8px}
        .chip{padding:6px 12px;border-radius:9px;font-size:12.5px;font-weight:700;
              background:#fff;border:1.5px solid var(--line);color:#94a3b8}
        .chip.on{background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe}
        .chip.zero{opacity:.55}
        .mini-q{margin-bottom:16px}
        .mini-q h4{margin:0 0 8px;font-size:13.5px;font-weight:800;color:#334155;line-height:1.35}

        .cm ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
        .cm li{background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy);
               border-radius:12px;padding:12px 16px;font-size:14px;line-height:1.6}
        .empty{text-align:center;padding:50px 20px;color:#94a3b8;background:rgba(255,255,255,.6);
                       border-radius:18px;border:2px dashed #cbd5e1;margin-bottom:24px}
                .empty b{display:block;font-size:17px;color:#475569;margin-bottom:6px}
                .warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:12px 14px;
                      border-radius:12px;font-size:13.5px;margin-bottom:20px}

                /* ── 레벨 기준 팝업 ── */
                .levelbtn{margin-left:8px;padding:5px 12px;border:1.5px solid var(--line);background:#fff;
                          color:var(--navy);border-radius:99px;font-size:12px;font-weight:800;cursor:pointer;
                          transition:all .2s;flex:0 0 auto}
                .levelbtn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
                .modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
                       background:rgba(15,23,42,.55);backdrop-filter:blur(3px);padding:20px}
                .modal.show{display:flex}
                .modal-panel{background:#fff;border-radius:18px;max-width:430px;width:100%;max-height:82vh;
                             overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:modalIn .25s ease-out}
                @keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:scale(1)}}
                .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;
                            border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
                .modal-head h3{margin:0;font-size:16px;font-weight:800;color:var(--navy-deep)}
                .modal-close{cursor:pointer;border:none;background:#f1f5f9;width:30px;height:30px;border-radius:99px;
                             font-size:15px;color:#64748b;line-height:30px;text-align:center;transition:background .2s}
                .modal-close:hover{background:#e2e8f0}
                .modal-body{padding:18px 20px 22px}
                .crit{margin-bottom:14px;padding:13px 15px;border-radius:12px;background:#f8fafc;border:1px solid #eef2f7}
                .crit h4{margin:0 0 8px;font-size:13.5px;font-weight:800;color:#1e293b;display:flex;align-items:center;gap:6px}
                .crit p{margin:0;font-size:12.5px;line-height:1.6;color:#475569}
                .crit p score{display:inline-flex;font-weight:800;color:var(--navy);background:#e8eef8;border-radius:6px;
                              padding:1px 7px;margin:0 2px}
                .crit.fastfail{border-color:#fecaca;background:#fef2f2}
                .crit.fastfail h4{color:#b91c1c}
                .threshold{display:flex;flex-direction:column;gap:6px;margin-top:6px}
                .threshold div{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#475569}
                .threshold .badge{flex:0 0 auto;min-width:44px;text-align:center;padding:3px 8px;border-radius:8px;
                                  font-weight:800;font-size:12px}
                .t1{background:#fef3c7;color:#92400e}.t2{background:#dbeafe;color:#1d4ed8}
                .t3{background:#dcfce7;color:#15803d}.t4{background:#f3e8ff;color:#7e22ce}
                @media(prefers-color-scheme:dark){
                    .levelbtn{background:#1c2027;border-color:#2c323b;color:#9db8e8}
                    .levelbtn:hover{background:#4a6da8;color:#fff}
                    .modal-panel{background:#1c2027}
                    .modal-head{background:#1c2027;border-color:#2c323b}
                    .modal-head h3{color:#9db8e8}
                    .modal-close{background:#2c323b;color:#cbd5e1}
                    .crit{background:#232830;border-color:#2c323b}
                    .crit h4{color:#f1f5f9}
                    .crit p{color:#cbd5e1}
                    .crit p score{background:#2e4a75;color:#93c5fd}
                    .crit.fastfail{background:#2c1414;border-color:#5c1a1a}
                    .crit.fastfail h4{color:#fca5a5}
                }

        footer{text-align:center;font-size:12px;color:#94a3b8;padding:20px;
               border-top:1px solid var(--line);background:#fff}
        @media(prefers-color-scheme:dark){
            body{background-color:#14171c;color:#e8eaee;
                 background-image:radial-gradient(at 0% 0%, hsla(220,40%,12%,1) 0, transparent 50%),
                                  radial-gradient(at 100% 100%, hsla(220,35%,15%,1) 0, transparent 50%)}
            nav{background:rgba(20,23,28,.9);border-color:#2c323b}
            .bs-t{color:#9db8e8}.bs-s{color:#94a3b8}
            .gcard{background:rgba(28,32,39,.96);border-color:#2c323b}
            .gcard h3{color:#f1f5f9}.sumrow h2{color:#f1f5f9;color:#f1f5f9}
            .totbox{background:#1c2027;border-color:#2c323b}
            :root{--lv1:#3B5578;--lv2:#4A6DA8;--lv3:#6E93CE;--lv4:#9DB8E8}
            .lvtile{border-color:#1c2027}
            .lvtile[data-lv="1"]{color:#fff}
            .lvtile[data-lv="2"]{color:#fff}
            .lvtile[data-lv="3"]{color:#0b0b0b}
            .lvtile[data-lv="4"]{color:#0b0b0b}
            .lvtile .badge{background:#292524;color:#fbbf24;border-color:#5c4a1a}
            .lvzchip{color:#64748b;background:#1c2027;border-color:#3b4451}
            .track{background:#2c323b}.lab .n{color:#9db8e8}
            .fill{background:#4a6da8}
            .row.top .fill{background:linear-gradient(90deg,#4a6da8,#3b82f6)}
            .chip{background:#1c2027;border-color:#2c323b}
            .chip.on{background:#1e3a5f;color:#93c5fd;border-color:#2e4a75}
            .cm li{background:#1c2027;border-color:#2c323b}
            .mini-q h4{color:#cbd5e1}
            .empty{background:rgba(28,32,39,.6);border-color:#2c323b}
            .warn{background:#2c2410;border-color:#5c4a1a;color:#fcd34d}
            footer{background:#14171c}
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

<nav>
    <div class="navin">
        <div class="brand">
            <div class="bslogo">BS</div>
            <div>
                <h1 class="bs-t">AI 사용 현황</h1>
                <p class="bs-s">📄 설문 결과 — 실시간 집계</p>
            </div>
        </div>
        <div class="navbtns">
                    <a href="/" class="tip" title="설문지로 이동">📝 설문지</a>
                    <button class="live" id="refreshBtn" title="최신 결과로 갱신" style="cursor:pointer">🔄 갱신</button>
                </div>
            </div>
        </nav>

<main>
    <div class="sumrow fadein">
        <div>
            <h2>설문 결과</h2>
            <p>🔄 구글 시트 연동 · <span id="upd">연결 중…</span></p>
        </div>
        <div class="totbox">
            <span class="lab">총 응답자</span>
            <span><b id="tot">0</b><span class="u">명</span></span>
        </div>
    </div>

    <div id="warn"></div>
    <div id="levelBox"></div>

    <!-- Row 2: Service(bar) + freq/sub(doughnut) -->
    <div class="row2" id="row2"></div>

    <!-- Row 3: use(progress) + security(chips) -->
    <div class="row2" id="row3"></div>

    <div class="gcard cm" id="cmbox" style="display:none"></div>
    </main>

    <!-- 레벨 기준 팝업 -->
    <div class="modal" id="levelModal" onclick="if(event.target===this)closeLevelModal()">
        <div class="modal-panel">
            <div class="modal-head">
                <h3>📏 사용자 레벨 판정 기준</h3>
                <button class="modal-close" onclick="closeLevelModal()" aria-label="닫기">✕</button>
            </div>
            <div class="modal-body" id="levelModalBody"></div>
        </div>
    </div>

    <footer>© 2026 Byucksan Corp — 결과는 [🔄 갱신] 버튼으로 최신화</footer>

<script>
const esc = s => String(s||'').replace(/[<>&]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]));
const pct = (n, b) => b > 0 ? Math.round(n / b * 100) : 0;
const NAVY='#1F3864', SL='#f1f5f9', BLUE='#3b82f6', EMERALD='#10b981', AMBER='#f59e0b';
let charts = {};

/* ── 순서형 값(≥0)에 대한 squarified treemap 레이아웃 ── */
function squarify(items, x, y, w, h, out){
    if (!items.length) return;
    if (items.length === 1){ out.push({...items[0], x, y, w, h}); return; }
    const total = items.reduce((s,d)=>s+d.value,0);
    const scale = (w*h)/total;
    const scaled = items.map(d=>({...d, area:d.value*scale}));
    const shortSide = Math.min(w,h);
    const worst = row => {
        const sum = row.reduce((s,r)=>s+r.area,0);
        const rmax = Math.max(...row.map(r=>r.area)), rmin = Math.min(...row.map(r=>r.area));
        return Math.max((shortSide*shortSide*rmax)/(sum*sum), (sum*sum)/(shortSide*shortSide*rmin));
    };
    let row = [scaled[0]], i = 1;
    while (i < scaled.length){
        const testRow = row.concat([scaled[i]]);
        if (worst(testRow) <= worst(row)){ row = testRow; i++; } else break;
    }
    const rowSum = row.reduce((s,r)=>s+r.area,0);
    let nx=x, ny=y, nw=w, nh=h, offset=0;
    if (w >= h){
        const rowW = rowSum / h;
        row.forEach(r=>{ const rh = h*(r.area/rowSum); out.push({...r, x, y:y+offset, w:rowW, h:rh}); offset += rh; });
        nx = x+rowW; nw = w-rowW;
    } else {
        const rowH = rowSum / w;
        row.forEach(r=>{ const rw = w*(r.area/rowSum); out.push({...r, x:x+offset, y, w:rw, h:rowH}); offset += rw; });
        ny = y+rowH; nh = h-rowH;
    }
    squarify(scaled.slice(row.length), nx, ny, nw, nh, out);
}

/* ── 레벨 분포 (treemap — 타일 면적 ∝ 인원, 자연인 옅음 → 달인 진함) ── */
function drawLevel(level){
    const box = document.getElementById('levelBox');
    if (!level || !level.counts || !(level.scored||0)){ box.innerHTML=''; return; }
    const scored = level.scored;
    const order = ['자연인','체험자','활용자','달인'];
    const ramp = {'자연인':'var(--lv1)','체험자':'var(--lv2)','활용자':'var(--lv3)','달인':'var(--lv4)'};
    const slot = {'자연인':1,'체험자':2,'활용자':3,'달인':4};
    const emoji = k => (level.levels||[]).filter(x=>x.key===k)[0]?.emoji || '';
    const present = order.filter(k => (level.counts[k]||0) > 0);
    const zero = order.filter(k => !(level.counts[k]||0));
    const maxCount = Math.max(...present.map(k=>level.counts[k]));

    box.innerHTML = `<div class="gcard fadein d1">
            <h3>🏅 사용자 레벨 분포<span class="sub">자동 집계 · ${scored}명</span><button class="levelbtn" onclick="openLevelModal()">📏 기준 보기</button></h3>
            <div class="lvtreemap" id="lvTreemap"></div>
            ${zero.length ? `<div class="lvzero">${zero.map(k=>
              `<span class="lvzchip"><span class="emoji">${emoji(k)}</span>${k} 0명 (0%)</span>`).join('')}</div>` : ''}
          </div>`;

    const tm = document.getElementById('lvTreemap');
    const w = tm.clientWidth, h = tm.clientHeight;
    const items = present.map(k => ({ key:k, value: level.counts[k] }))
                          .sort((a,b) => b.value - a.value);
    const rects = [];
    squarify(items, 0, 0, w, h, rects);

    tm.innerHTML = rects.map(r => {
        const p = Math.round(r.value/scored*100), isTop = r.value === maxCount;
        const size = r.w >= 90 && r.h >= 64 ? 'big' : (r.w >= 46 && r.h >= 40 ? 'mid' : 'tiny');
        const label = size === 'big'
          ? `<span class="nm"><span class="emoji">${emoji(r.key)}</span>${r.key}${isTop?'<span class="badge">최다</span>':''}</span>
             <span class="val">${r.value}명<span class="p">(${p}%)</span></span>`
          : size === 'mid'
          ? `<span class="nm"><span class="emoji">${emoji(r.key)}</span>${r.value}명</span>`
          : `<span class="emoji">${emoji(r.key)}</span>`;
        return `<div class="lvtile ${size}" data-lv="${slot[r.key]}"
                     style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:${ramp[r.key]}">
                  ${label}
                </div>`;
    }).join('');
    }

    /* ── 레벨 기준 팝업 ── */
    const LEVEL_CRITERIA = `
      <div class="crit">
        <h4>1️⃣ 사용 빈도</h4>
        <p>하루에 여러 번 <score>+5</score> · 하루 1회 정도 <score>+3</score> · 주 2~3회 <score>+2</score> · 주 1회 미만 <score>+1</score></p>
      </div>
      <div class="crit fastfail">
        <h4>⚡ 즉시 자연인</h4>
        <p>사용 빈도가 <b>거의 안 씀</b>이면 다른 항목과 관계없이 <b>자연인</b>으로 판정됩니다.</p>
      </div>
      <div class="crit">
        <h4>2️⃣ 유료 구독</h4>
        <p>유료 사용(회사/개인) <score>+3</score> · 무료만 사용 <score>+1</score></p>
      </div>
      <div class="crit">
        <h4>3️⃣ 활용 용도 다양성</h4>
        <p>3개 이상 <score>+2</score> · 1개 이상 <score>+1</score></p>
      </div>
      <div class="crit">
        <h4>4️⃣ 데이터 입력 적극성</h4>
        <p>업무자료 외부 입력: 있다 <score>+2</score> · 민감하지 않은 자료만 <score>+1</score></p>
      </div>
      <div class="crit">
        <h4>최종 판정 (총점)</h4>
        <div class="threshold">
          <div><span class="badge t4">≥10</span><b>달인 🏆</b></div>
          <div><span class="badge t3">≥6</span><b>활용자 ⚙️</b></div>
          <div><span class="badge t2">≥3</span><b>체험자 🔍</b></div>
          <div><span class="badge t1">&lt;3</span><b>자연인 🍃</b></div>
        </div>
      </div>`;

    function openLevelModal(){
        const m = document.getElementById('levelModal');
        document.getElementById('levelModalBody').innerHTML = LEVEL_CRITERIA;
        m.classList.add('show');
    }
    function closeLevelModal(){
        document.getElementById('levelModal').classList.remove('show');
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLevelModal(); });

/* ── Chart 파괴·재생성 헬퍼 (중복 인스턴스 방지) ── */
function chart(id, cfg){
    if (charts[id]){ charts[id].destroy(); }
    const el = document.getElementById(id);
    if (!el) return;
    charts[id] = new Chart(el.getContext('2d'), cfg);
}

/* Row2: 서비스 가로 바 + freq/sub 도넛 */
function row2(stats){
    const box = document.getElementById('row2');
    const by = {}; stats.forEach(s=>by[s.id]=s);
    let html = '';

    /* 서비스 카드 — 가로 바 차트 (Chart.js) */
    if (by.tools){
        html += `<div class="gcard fadein d2" style="grid-column:auto"><h3>💻 현재 쓰고 계신 AI 서비스<span class="sub">복수 응답</span></h3>
          <div class="chart-wrap h260"><canvas id="serviceChart"></canvas></div></div>`;
    }

    /* 파생 카드: 사용빈도(순위 막대) + 유료구독(스택바·KPI) — 첨부 인포그래픽 스타일 */
    const side = [];
    if (by.freq){
        const arr = by.freq.options;
        const max = Math.max(...arr.map(o=>o.count),0);
        const base = by.freq.answered || max || 1;
        side.push(`<div>
            <h4 style="margin:0 0 12px;font-size:13.5px;font-weight:800;color:#1e293b;display:flex;align-items:center;gap:6px">⏱️ 사용 빈도</h4>
            <div style="display:flex;flex-direction:column;gap:11px">
                ${arr.map(o=>{
                    const w = max>0 && o.count>0 ? Math.round(o.count/max*100) : 0;
                    const top = o.count===max && max>0;
                    return `
                    <div style="display:flex;align-items:center;gap:10px;${o.count===0?'opacity:.5':''}">
                        <div style="width:78px;font-size:11.5px;font-weight:${top?800:600};color:${top?'#1e293b':'#64748b'};flex:0 0 auto">${esc(o.label)}</div>
                        <div style="flex:1;height:9px;background:#f1f5f9;border-radius:99px;overflow:hidden">
                            <div style="height:100%;background:${top?'#10b981':'#cbd5e1'};border-radius:99px;width:${w}%;box-shadow:${top?'0 0 8px rgba(16,185,129,.5)':'none'};transition:width .6s"></div>
                        </div>
                        <div style="width:34px;text-align:right;font-size:11.5px;font-weight:${top?800:600};color:${top?'#059669':'#94a3b8'};flex:0 0 auto">${o.count}명</div>
                    </div>`;
                }).join('')}
            </div>`);
    }
    if (by.paid){
        const arr = by.paid.options;
        const base = by.paid.answered || Math.max(...arr.map(o=>o.count),0) || 1;
        // 스택바 색 (회사·개인·무료·사용안함 순)
        const stackColors = ['#6366f1','#3b82f6','#94a3b8','#cbd5e1'];
        side.push(`<div style="border-top:1px solid #f1f5f9;padding-top:14px">
            <h4 style="margin:0 0 10px;font-size:13.5px;font-weight:800;color:#1e293b;display:flex;align-items:center;gap:6px">💳 유료 구독 여부</h4>
            <div style="display:flex;gap:0;height:12px;width:100%;background:#f1f5f9;border-radius:99px;overflow:hidden;margin-bottom:14px">
                ${arr.map((o,i)=>`<div title="${esc(o.label)}: ${o.count}명" style="height:100%;background:${stackColors[i]||'#cbd5e1'};width:${Math.round(o.count/base*100)}%;transition:width .6s"></div>`).join('')}
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                ${arr.map((o,i)=>{
                    const p = Math.round(o.count/base*100);
                    const on = o.count>0;
                    return `
                    <div style="background:${on?'#eff6ff':'#f8fafc'};padding:8px 10px;border-radius:10px;border:1px solid ${on?'#bfdbfe':'#e2e8f0'};${on?'':'opacity:.6'}">
                        <div style="font-size:10px;font-weight:700;color:${on?'#3b82f6':'#64748b'};margin-bottom:2px">${esc(o.label)}</div>
                        <div style="font-size:14px;font-weight:800;color:${on?'#1d4ed8':'#475569'}">${o.count}명 <span style="font-size:10px;font-weight:600;color:${on?'#60a5fa':'#94a3b8'}">${p}%</span></div>
                    </div>`;
                }).join('')}
            </div>`);
    }
    if (side.length){
        html += `<div class="gcard fadein d3" style="display:flex;flex-direction:column;gap:16px">${side.join('')}</div>`;
    }
    box.innerHTML = html;

    // 서비스 바 차트 (최다 항목 네이비 강조)
    if (by.tools){
        const max = Math.max(...by.tools.options.map(o=>o.count),0);
        chart('serviceChart', {
            type:'bar',
            data:{ labels: by.tools.options.map(o=>o.label),
                datasets:[{ label:'응답자', data: by.tools.options.map(o=>o.count),
                    backgroundColor: by.tools.options.map(o=> o.count===max && max>0 ? NAVY : SL),
                    borderRadius:6, barThickness:22 }]},
            options:{ indexAxis:'y', plugins:{legend:{display:false}},
                scales:{ x:{beginAtZero:true, ticks:{precision:0}, grid:{color:SL}, border:{display:false}},
                         y:{grid:{display:false}, border:{display:false}, ticks:{color:'#475569',font:{weight:'600'}}} },
                animation:{duration:800, easing:'easeOutQuart'} }
        });
    }
}

/* Row3: use progress + agent/trust/data/support chips */
function row3(stats){
    const box = document.getElementById('row3');
    const by = {}; stats.forEach(s=>by[s.id]=s);
    let html='';

    if (by.use){
        const max = Math.max(...by.use.options.map(o=>o.count),0);
        html += `<div class="gcard fadein d2"><h3>🎯 주로 쓰는 용도<span class="sub">복수 응답</span></h3>
          ${by.use.options.map(o=>{
            const p=pct(o.count, by.use.answered), top=max>0&&o.count===max;
            return `<div class="row ${top?'top':''} ${o.count===0?'zero':''}">
              <div class="lab"><span>${o.label}</span><span class="n">${o.count}명 (${p}%)</span></div>
              <div class="track"><div class="fill" style="width:${p}%"></div></div></div>`;
          }).join('')}
        </div>`;
    }

    const secStats = stats.filter(s=>['agent','trust','data','support'].includes(s.id));
    if (secStats.length){
        html += `<div class="gcard fadein d3"><h3>🧠 AI 활용 인식·태도</h3>
          ${secStats.map(s=>{
            const max=Math.max(...s.options.map(o=>o.count),0);
            return `<div class="mini-q"><h4>${esc(s.title)}</h4><div class="chips">
              ${s.options.map(o=>{
                const on=max>0&&o.count===max;
                return `<span class="chip ${on?'on':''} ${o.count===0?'zero':''}">${esc(o.label)} (${o.count}명)</span>`;
              }).join('')}</div></div>`;
          }).join('')}
        </div>`;
    }
    box.innerHTML = html;
}

function draw(d){
    document.getElementById('tot').textContent = d.total;
    document.getElementById('upd').innerHTML =
        '🔄 구글 시트 연동 · ' + new Date().toLocaleTimeString('ko-KR') +
        (d.stale ? ' · <b style="color:#d97706">갱신 지연</b>' : '');
    document.getElementById('warn').innerHTML = d.persisted ? '' :
        '<div class="warn">⚠️ 저장소가 연결되지 않아 응답이 유지되지 않습니다.</div>';

    const row2el=document.getElementById('row2'), row3el=document.getElementById('row3'),
          cm=document.getElementById('cmbox');
    const stats = d.stats || [];

    if (!d.total){
        row2el.innerHTML=''; row3el.innerHTML='';
        Object.keys(charts).forEach(k=>{ charts[k].destroy(); });
        charts={};
        cm.style.display='none';
        drawLevel(d.level);
        return;
    }
    row2(stats); row3(stats);

    if (d.comments && d.comments.length){
        cm.style.display='';
        cm.innerHTML=`<h3>💬 한마디<span class="sub">${d.comments.length}건</span></h3>
          <ul>${d.comments.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`;
    } else cm.style.display='none';
    drawLevel(d.level);
}

let lastGood=null;
async function tick(){
    try{
        const r = await fetch('/api/stats', { cache:'no-store' });
        if (!r.ok) throw new Error('HTTP '+r.status);
        const j = await r.json();
        if (j && j.total!==undefined){ draw(j); lastGood=j; }
        else if (lastGood) draw({...lastGood, stale:true});
    }catch(e){
        if (lastGood) draw({...lastGood, stale:true});
        else document.getElementById('upd').textContent='연결 오류 — 재시도 중';
    }
}
tick();

// 수동 갱신 버튼 — 자동 4초 갱신 제거 (깜박임 방지)
document.getElementById('refreshBtn').addEventListener('click', async () => {
    const btn = document.getElementById('refreshBtn');
    btn.disabled = true; btn.textContent = '⏳ 갱신 중…';
    await tick();
    btn.disabled = false; btn.innerHTML = '🔄 갱신';
});
</script>
